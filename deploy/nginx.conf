# Miara: statyczna aplikacja na własnym serwerze (nginx).
# Podmień TWOJA_DOMENA i ścieżki certyfikatu. Pliki aplikacji kopiuj do /var/www/miara.
# Te same nagłówki co w vercel.json. Sprawdzenie: sudo nginx -t

server {
    listen 80;
    listen [::]:80;
    server_name TWOJA_DOMENA;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    # "http2" w listen działa w nginx 1.24 (Ubuntu 24.04); od 1.25.1 można zamiast tego użyć "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TWOJA_DOMENA;

    ssl_certificate     /etc/letsencrypt/live/TWOJA_DOMENA/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TWOJA_DOMENA/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/miara;
    index index.html;
    server_tokens off;
    access_log off;  # aplikacja nie potrzebuje dzienników wejść

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        # nginx nie dziedziczy add_header, gdy blok ma własny: powtórzenie nagłówków bezpieczeństwa
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/(index\.html|app\.js|app\.css|sw\.js|sw-register\.js)?$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/(icons|brand)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri =404;
    }
}
