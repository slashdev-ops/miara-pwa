name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Składnia JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --check sw-register.js
      - name: Poprawny JSON konfiguracji
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Test dymny aplikacji
        run: node tests/smoke.js

  przegladarka:
    # Chromium i WebKit (silnik Safari), tryb jasny i ciemny, iPhone 13 i 320 px: tests/przegladarka/miara.spec.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/przegladarka
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/przegladarka/package-lock.json
      - name: Zależności testów
        run: npm ci --no-audit --no-fund
      # Odporność na awarie sieci (11.11.2026: serwery Ubuntu nieosiągalne, krok wisiał do limitu 15 min):
      # przeglądarki z pamięci podręcznej, biblioteki systemowe z limitem czasu i ponowieniem
      - name: Pamięć podręczna przeglądarek
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/przegladarka/package-lock.json') }}
      - name: Przeglądarki
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Biblioteki systemowe przeglądarek
        timeout-minutes: 13
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install-deps chromium webkit && exit 0
            echo "Próba $i nie powiodła się, ponawiam za 20 s"; sleep 20
          done
          exit 1
      - name: Testy w przeglądarce
        run: npx playwright test
      - name: Raport po błędzie
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raport-przegladarka
          path: tests/przegladarka/playwright-report/
          retention-days: 7
